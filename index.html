<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>🎬 Movie App</h1>

        <label class="switch">
            <input type="checkbox" id="darkMode">
            <span class="slider"></span>
        </label>
    </header>

    <aside class="sidebar">

        <h2>Tìm kiếm</h2>

        <input
            type="text"
            id="search"
            placeholder="Nhập tên phim..."
        >

        <h2>Thể loại</h2>

        <!-- JavaScript sẽ tự tạo checkbox -->
        <div id="genreList"></div>

    </aside>

    <!-- JavaScript sẽ tự tạo các Movie Card -->
    <main class="main" id="movieList">

    </main>

</div>

<script src="app.js"></script>
<script src="script.js"></script>

</body>
</html>
