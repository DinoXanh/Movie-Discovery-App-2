<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>🎬 Movie App</h1>

        <label class="switch">
            <input type="checkbox" id="darkMode">
            <span class="slider"></span>
        </label>
    </header>

    <aside class="sidebar">

        <h2>🔍 Tìm kiếm</h2>

        <input
            type="text"
            id="search"
            placeholder="Nhập tên phim..."
        >

        <h2>🎭 Thể loại</h2>

        <div id="genreList"></div>

        <hr style="margin:25px 0;border:1px solid rgba(255,255,255,.2);">

        <div class="menu-button">

            <button id="btn35">
                📄 Bài 35
            </button>

            <button id="btn36">
                🌐 Bài 36
            </button>

        </div>

    </aside>

    <main class="main" id="movieList">

    </main>

</div>

<!-- Modal phim -->

<div id="modal" class="modal">

    <div class="modal-content">

        <span id="close">&times;</span>

        <img id="modalPoster" src="" alt="Poster">

        <h2 id="modalTitle"></h2>

        <p><b>Năm phát hành:</b> <span id="modalYear"></span></p>

        <p><b>Đạo diễn:</b> <span id="modalDirector"></span></p>

        <p><b>Diễn viên:</b> <span id="modalActors"></span></p>

        <p id="modalDescription"></p>

    </div>

</div>

<!-- Modal Bài 35 -->

<div id="imageModal" class="modal">

    <div class="modal-content">

        <span id="closeImage">&times;</span>

        <img
            src="images/ketqua.jpg"
            id="ketQuaImg"
            alt="Kết quả bài 35"
        >

    </div>

</div>

<script src="app.js"></script>
<script src="script.js"></script>

</body>
</html>
