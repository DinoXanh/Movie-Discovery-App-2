<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>🎬 Movie App</h1>

        <label class="switch">
            <input type="checkbox" id="darkMode">
            <span class="slider"></span>
        </label>
    </header>

    <aside class="sidebar">

        <h2>Tìm kiếm</h2>

        <input
            type="text"
            id="search"
            placeholder="Nhập tên phim..."
        >

        <h2>Thể loại</h2>

        <div id="genreList"></div>

    </aside>

    <main class="main" id="movieList">

    </main>

</div>

<div id="modal" class="modal">

    <div class="modal-content">

        <span id="close">&times;</span>

        <img id="modalPoster" src="" alt="Poster">

        <h2 id="modalTitle"></h2>

        <p><b>Năm phát hành:</b> <span id="modalYear"></span></p>

        <p><b>Đạo diễn:</b> <span id="modalDirector"></span></p>

        <p><b>Diễn viên:</b> <span id="modalActors"></span></p>

        <p id="modalDescription"></p>

    </div>

</div>

<script src="app.js"></script>
<script src="script.js"></script>

</body>
</html>
