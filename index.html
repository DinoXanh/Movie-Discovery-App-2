<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header class="header">
        <h1>🎬 Movie App</h1>

        <label class="switch">
            <input type="checkbox" id="darkMode">
            <span class="slider"></span>
        </label>
    </header>

    <aside class="sidebar">
        <h2>Bộ lọc</h2>

        <div class="filter">
            <label>Thể loại</label>
            <select>
                <option>Tất cả</option>
                <option>Anime</option>
                <option>Khoa học viễn tưởng</option>
                <option>Siêu anh hùng</option>
            </select>
        </div>

        <div class="filter">
            <label>Năm phát hành</label>
            <select>
                <option>Tất cả</option>
                <option>2026</option>
                <option>2025</option>
                <option>2023</option>
                <option>2021</option>
                <option>2019</option>
                <option>2017</option>
                <option>2014</option>
            </select>
        </div>
    </aside>

    <main class="main">

        <div class="movie-card">
            <img src="images/part1.webp" alt="Girl und Panzer Part 1">
            <div class="info">
                <h3>Girl und Panzer das Finale Part 1</h3>
                <p>2017</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="images/part2.webp" alt="Girl und Panzer Part 2">
            <div class="info">
                <h3>Girl und Panzer das Finale Part 2</h3>
                <p>2019</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="images/part3.webp" alt="Girl und Panzer Part 3">
            <div class="info">
                <h3>Girl und Panzer das Finale Part 3</h3>
                <p>2021</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="images/part4.webp" alt="Girl und Panzer Part 4">
            <div class="info">
                <h3>Girl und Panzer das Finale Part 4</h3>
                <p>2023</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="images/part5.webp" alt="Girl und Panzer Part 5">
            <div class="info">
                <h3>Girl und Panzer das Finale Part 5</h3>
                <p>2025</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="images/interstellar.jpg" alt="Interstellar">
            <div class="info">
                <h3>Interstellar</h3>
                <p>2014</p>
            </div>
        </div>

        <div class="movie-card">
            <img src="images/spider.jpg" alt="Spider-Man Brand New Day">
            <div class="info">
                <h3>Spider-Man: Brand New Day</h3>
                <p>2026</p>
            </div>
        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
